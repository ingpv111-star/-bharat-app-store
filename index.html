<!DOCTYPE html>
<html>
<head>
<title>🇮🇳 Bharat AI App Store</title>
<meta charset="UTF-8" />

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(to right,#ff9933,#ffffff,#138808);
  text-align:center;
}

.container{
  width:95%;
  max-width:1200px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
  margin-top:30px;
}

input,textarea,select{
  width:90%;
  padding:8px;
  margin:5px;
}

button{
  padding:8px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#loginBtn{background:#4285F4;color:white;}
#logoutBtn{background:#d9534f;color:white;}
#uploadBtn{background:green;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:15px;
}

.app-card{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  text-align:left;
}

.app-card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
}

.download-btn{
  background:#138808;
  color:white;
  padding:6px 12px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
  margin-top:5px;
}

.delete-btn{
  background:crimson;
  color:white;
}

.featured{
  background:#ffeaa7;
  padding:20px;
  border-radius:15px;
  margin-bottom:25px;
}

</style>
</head>
<body>

<div class="container">

<h1>🇮🇳 Bharat AI App Store</h1>

<button id="loginBtn">Login</button>
<button id="logoutBtn" style="display:none;">Logout</button>
<h3 id="welcome"></h3>

<!-- Featured Section -->
<div id="featuredSection"></div>

<!-- Trending Section -->
<h2>🔥 Trending Apps</h2>
<div class="grid" id="trendingApps"></div>

<!-- Top Rated Section -->
<h2>⭐ Top Rated Apps</h2>
<div class="grid" id="topRatedApps"></div>

<!-- All Apps -->
<h2>📦 All Apps</h2>
<div class="grid" id="allApps"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyChGwSmE4D-ZmvoaBfAQJVzye4WBdbg4bc",
authDomain:"bharat-app-store-8a633.firebaseapp.com",
projectId:"bharat-app-store-8a633",
storageBucket:"bharat-app-store-8a633.firebasestorage.app",
messagingSenderId:"884921246902",
appId:"1:884921246902:web:4dcd9e8f1413be24bd7217"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const welcome=document.getElementById("welcome");

loginBtn.onclick=()=>signInWithPopup(auth,provider);
logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,(user)=>{
if(user){
welcome.innerHTML="Welcome "+user.displayName+" 👑";
loginBtn.style.display="none";
logoutBtn.style.display="inline";
}else{
welcome.innerHTML="";
loginBtn.style.display="inline";
logoutBtn.style.display="none";
}
});

async function loadApps(){

const snapshot=await getDocs(collection(db,"apps"));
let apps=[];
snapshot.forEach(docSnap=>{
let data=docSnap.data();
data.id=docSnap.id;
apps.push(data);
});

if(apps.length===0) return;

// 🔥 Trending (Most Downloaded)
let trending=[...apps].sort((a,b)=>(b.downloads||0)-(a.downloads||0));

// ⭐ Top Rated
let topRated=[...apps].sort((a,b)=>(b.rating||0)-(a.rating||0));

// 🏆 Featured (Highest Rating + Downloads)
let featured=topRated[0];

displayFeatured(featured);
displaySection("trendingApps",trending.slice(0,4));
displaySection("topRatedApps",topRated.slice(0,4));
displaySection("allApps",apps);

}

function displayFeatured(app){
if(!app) return;
document.getElementById("featuredSection").innerHTML=`
<div class="featured">
<h2>🏆 Featured App</h2>
<h3>${app.name}</h3>
<p>${app.description}</p>
<p>⭐ ${app.rating} | ⬇ ${app.downloads||0}</p>
<a class="download-btn" href="${app.link}" target="_blank" onclick="increaseDownload('${app.id}')">Install Now</a>
</div>
`;
}

function displaySection(id,apps){
let container=document.getElementById(id);
container.innerHTML="";
apps.forEach(app=>{
container.innerHTML+=`
<div class="app-card">
<img src="${app.logo||'https://via.placeholder.com/300x120'}">
<h4>${app.name}</h4>
<p>${app.description}</p>
<p>⭐ ${app.rating} | ⬇ ${app.downloads||0}</p>
<a class="download-btn" href="${app.link}" target="_blank" onclick="increaseDownload('${app.id}')">Download</a>
</div>
`;
});
}

window.increaseDownload=async(id)=>{
const appRef=doc(db,"apps",id);
await updateDoc(appRef,{
downloads:increment(1)
});
};

loadApps();

</script>
</body>
</html>

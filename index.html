<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bharat AI App Store</title>
</head>

<body>

  <h1>🇮🇳 Bharat AI App Store</h1>

  <button onclick="login()">Login with Google</button>
  <button onclick="logout()">Logout</button>

  <p id="userInfo"></p>

  <h2>Available Apps</h2>
  <div id="appList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    import { 
      getFirestore, 
      collection, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_REAL_KEY",
      authDomain: "PASTE_YOUR_REAL_DOMAIN",
      projectId: "PASTE_YOUR_REAL_PROJECT_ID",
      storageBucket: "PASTE_YOUR_REAL_BUCKET",
      messagingSenderId: "PASTE_YOUR_REAL_MSG_ID",
      appId: "PASTE_YOUR_REAL_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    window.login = function() {
      signInWithPopup(auth, provider)
        .catch((error) => {
          alert("Login Error: " + error.message);
        });
    }

    window.logout = function() {
      signOut(auth);
      document.getElementById("userInfo").innerHTML = "";
      document.getElementById("appList").innerHTML = "";
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("userInfo").innerHTML =
          "Welcome " + user.displayName + " 🎉";
        loadApps();
      }
    });

    async function loadApps() {
      const querySnapshot = await getDocs(collection(db, "apps"));
      let output = "";

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        output += `
          <div style="border:1px solid gray; padding:10px; margin:10px;">
            <h3>${data.name}</h3>
            <p>${data.description}</p>
          </div>
        `;
      });

      document.getElementById("appList").innerHTML = output;
    }

  </script>

</body>
</html>

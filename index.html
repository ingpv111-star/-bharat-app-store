<!DOCTYPE html>
<html>
<head>
  <title>🇮🇳 Bharat AI App Store</title>
  <meta charset="UTF-8" />
</head>
<body>

  <h1>🇮🇳 Bharat AI App Store</h1>

  <button id="loginBtn">Login with Google</button>
  <button id="logoutBtn" style="display:none;">Logout</button>

  <h2 id="welcome"></h2>

  <h3>Available Apps</h3>
  <div id="apps"></div>

  <script type="module">

    // Firebase CDN imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 🔥 Your REAL Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyChGwSmE4D-ZmvoaBfAQJVzye4WBdbg4bc",
      authDomain: "bharat-app-store-8a633.firebaseapp.com",
      projectId: "bharat-app-store-8a633",
      storageBucket: "bharat-app-store-8a633.firebasestorage.app",
      messagingSenderId: "884921246902",
      appId: "1:884921246902:web:4dcd9e8f1413be24bd7217",
      measurementId: "G-PNK79SQ903"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const welcome = document.getElementById("welcome");

    // Login
    loginBtn.onclick = () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          console.log("Login Success");
        })
        .catch((error) => {
          alert("Login Error: " + error.message);
        });
    };

    // Logout
    logoutBtn.onclick = () => {
      signOut(auth);
    };

    // Detect user state
    onAuthStateChanged(auth, (user) => {
      if (user) {
        welcome.innerHTML = "Welcome " + user.displayName + " 🎉";
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline";
      } else {
        welcome.innerHTML = "";
        loginBtn.style.display = "inline";
        logoutBtn.style.display = "none";
      }
    });

  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bharat AI App Store</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #ff6600;
    }

    input, textarea {
      width: 300px;
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px 15px;
      margin: 5px;
      cursor: pointer;
      border: none;
      background: #ff6600;
      color: white;
      border-radius: 5px;
    }

    button:hover {
      background: #e65c00;
    }

    #appList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .appCard {
      width: 250px;
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

  <h1>🇮🇳 Bharat AI App Store</h1>

  <button onclick="login()">Login with Google</button>
  <button onclick="logout()">Logout</button>

  <p id="userInfo"></p>

  <div id="uploadSection" style="display:none;">
    <h2>Upload Your App</h2>
    <input type="text" id="appName" placeholder="App Name"><br>
    <textarea id="appDesc" placeholder="App Description"></textarea><br>
    <button onclick="uploadApp()">Upload App</button>
  </div>

  <h2>Available Apps</h2>
  <div id="appList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    import { 
      getFirestore, 
      collection, 
      getDocs,
      addDoc
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_REAL_KEY",
      authDomain: "PASTE_YOUR_REAL_DOMAIN",
      projectId: "PASTE_YOUR_REAL_PROJECT_ID",
      storageBucket: "PASTE_YOUR_REAL_BUCKET",
      messagingSenderId: "PASTE_YOUR_REAL_MSG_ID",
      appId: "PASTE_YOUR_REAL_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    window.login = function() {
      signInWithPopup(auth, provider)
        .catch((error) => {
          alert("Login Error: " + error.message);
        });
    }

    window.logout = function() {
      signOut(auth);
      document.getElementById("userInfo").innerHTML = "";
      document.getElementById("appList").innerHTML = "";
      document.getElementById("uploadSection").style.display = "none";
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("userInfo").innerHTML =
          "Welcome " + user.displayName + " 🎉";

        document.getElementById("uploadSection").style.display = "block";

        loadApps();
      }
    });

    window.uploadApp = async function() {
      const name = document.getElementById("appName").value;
      const description = document.getElementById("appDesc").value;

      if (!name || !description) {
        alert("Please fill all fields");
        return;
      }

      await addDoc(collection(db, "apps"), {
        name: name,
        description: description,
        createdAt: new Date()
      });

      alert("App Uploaded Successfully 🚀");

      document.getElementById("appName").value = "";
      document.getElementById("appDesc").value = "";

      loadApps();
    }

    async function loadApps() {
      const querySnapshot = await getDocs(collection(db, "apps"));
      let output = "";

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        output += `
          <div class="appCard">
            <h3>${data.name}</h3>
            <p>${data.description}</p>
          </div>
        `;
      });

      document.getElementById("appList").innerHTML = output;
    }

  </script>

</body>
</html>

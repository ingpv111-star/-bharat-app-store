<!DOCTYPE html>
<html>
<head>
  <title>🇮🇳 Bharat AI App Store</title>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ff9933, #ffffff, #138808);
      text-align: center;
    }

    .container {
      margin-top: 40px;
      background: white;
      width: 600px;
      margin-left: auto;
      margin-right: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    input, textarea, select {
      width: 90%;
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #loginBtn { background: #4285F4; color: white; }
    #logoutBtn { background: #d9534f; color: white; }
    #uploadBtn { background: green; color: white; }

    .app-card {
      background: #f5f5f5;
      padding: 15px;
      margin: 15px;
      border-radius: 12px;
      text-align: left;
    }

    .download-btn {
      background: #138808;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
      margin-top: 5px;
    }

  </style>
</head>
<body>

<div class="container">

  <h1>🇮🇳 Bharat AI App Store</h1>

  <button id="loginBtn">Login with Google</button>
  <button id="logoutBtn" style="display:none;">Logout</button>

  <h2 id="welcome"></h2>

  <div id="uploadSection" style="display:none;">
    <h3>Upload Your App</h3>

    <input type="text" id="appName" placeholder="App Name" />
    <textarea id="appDesc" placeholder="App Description"></textarea>

    <select id="appCategory">
      <option value="">Select Category</option>
      <option>AI</option>
      <option>Education</option>
      <option>Finance</option>
      <option>Tools</option>
      <option>Entertainment</option>
    </select>

    <input type="text" id="appLink" placeholder="Download Link (APK or Website URL)" />

    <button id="uploadBtn">Upload App</button>
  </div>

  <h3>Available Apps</h3>
  <div id="apps"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyChGwSmE4D-ZmvoaBfAQJVzye4WBdbg4bc",
  authDomain: "bharat-app-store-8a633.firebaseapp.com",
  projectId: "bharat-app-store-8a633",
  storageBucket: "bharat-app-store-8a633.firebasestorage.app",
  messagingSenderId: "884921246902",
  appId: "1:884921246902:web:4dcd9e8f1413be24bd7217"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const welcome = document.getElementById("welcome");
const uploadSection = document.getElementById("uploadSection");
const uploadBtn = document.getElementById("uploadBtn");
const appsDiv = document.getElementById("apps");

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    welcome.innerHTML = "Welcome " + user.displayName + " 🎉";
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline";
    uploadSection.style.display = "block";
    loadApps();
  } else {
    welcome.innerHTML = "";
    loginBtn.style.display = "inline";
    logoutBtn.style.display = "none";
    uploadSection.style.display = "none";
  }
});

uploadBtn.onclick = async () => {
  const name = document.getElementById("appName").value;
  const desc = document.getElementById("appDesc").value;
  const category = document.getElementById("appCategory").value;
  const link = document.getElementById("appLink").value;

  if(name && desc && category && link){
    await addDoc(collection(db, "apps"), {
      name,
      description: desc,
      category,
      link
    });

    alert("App Uploaded Successfully 🚀");
    loadApps();
  } else {
    alert("Please fill all fields");
  }
};

async function loadApps(){
  appsDiv.innerHTML = "";
  const querySnapshot = await getDocs(collection(db, "apps"));
  querySnapshot.forEach((doc) => {
    const data = doc.data();
    appsDiv.innerHTML += `
      <div class="app-card">
        <h4>${data.name}</h4>
        <p><b>Category:</b> ${data.category}</p>
        <p>${data.description}</p>
        <a class="download-btn" href="${data.link}" target="_blank">Download</a>
      </div>
    `;
  });
}

</script>

</body>
</html>

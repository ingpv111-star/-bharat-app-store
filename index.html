<!DOCTYPE html>
<html>
<head>
<title>🇮🇳 Bharat AI App Store</title>
<meta charset="UTF-8" />

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(to right,#ff9933,#ffffff,#138808);
  text-align:center;
  transition:0.3s;
}

.dark{
  background:#111;
  color:white;
}

.container{
  width:95%;
  max-width:1100px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:0.3s;
}

.dark .container{
  background:#222;
}

button{
  padding:8px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

input,textarea,select{
  width:90%;
  padding:8px;
  margin:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:15px;
}

.app-card{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  text-align:left;
}

.dark .app-card{
  background:#333;
}

.status{
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.download{background:#138808;color:white;}

</style>
</head>
<body>

<div class="container">

<h1>🇮🇳 Bharat AI App Store (Beta)</h1>

<button id="loginBtn">Login</button>
<button id="logoutBtn" style="display:none;">Logout</button>
<button id="darkToggle">🌙</button>

<h3 id="welcome"></h3>

<div id="uploadSection" style="display:none;">
<h3>Submit Your App</h3>
<input type="text" id="appName" placeholder="App Name">
<textarea id="appDesc" placeholder="Description"></textarea>
<select id="appCategory">
<option value="">Select Category</option>
<option>AI</option>
<option>Education</option>
<option>Finance</option>
<option>Tools</option>
<option>Entertainment</option>
</select>
<input type="text" id="appLink" placeholder="Download Link">
<button id="uploadBtn">Submit</button>
</div>

<h2>⏳ Pending Apps (Admin Only)</h2>
<div class="grid" id="pendingApps"></div>

<h2>📦 Approved Apps</h2>
<div class="grid" id="approvedApps"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyChGwSmE4D-ZmvoaBfAQJVzye4WBdbg4bc",
authDomain:"bharat-app-store-8a633.firebaseapp.com",
projectId:"bharat-app-store-8a633",
storageBucket:"bharat-app-store-8a633.firebasestorage.app",
messagingSenderId:"884921246902",
appId:"1:884921246902:web:4dcd9e8f1413be24bd7217"
};

const ADMIN_EMAIL="ingpv111@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const uploadSection=document.getElementById("uploadSection");
const uploadBtn=document.getElementById("uploadBtn");
const pendingDiv=document.getElementById("pendingApps");
const approvedDiv=document.getElementById("approvedApps");
const welcome=document.getElementById("welcome");
const darkToggle=document.getElementById("darkToggle");

let currentUser=null;

loginBtn.onclick=()=>signInWithPopup(auth,provider);
logoutBtn.onclick=()=>signOut(auth);

darkToggle.onclick=()=>{
document.body.classList.toggle("dark");
};

onAuthStateChanged(auth,(user)=>{
currentUser=user;
if(user){
welcome.innerHTML="Welcome "+user.displayName;
loginBtn.style.display="none";
logoutBtn.style.display="inline";
uploadSection.style.display="block";
loadApps();
}else{
welcome.innerHTML="";
loginBtn.style.display="inline";
logoutBtn.style.display="none";
uploadSection.style.display="none";
}
});

uploadBtn.onclick=async()=>{
const name=appName.value;
const desc=appDesc.value;
const category=appCategory.value;
const link=appLink.value;

if(name && desc && category && link){
await addDoc(collection(db,"apps"),{
name,
description:desc,
category,
link,
status:"pending",
developerEmail:currentUser.email
});
alert("App Submitted for Review");
loadApps();
}
};

async function loadApps(){
pendingDiv.innerHTML="";
approvedDiv.innerHTML="";

const snapshot=await getDocs(collection(db,"apps"));

snapshot.forEach(docSnap=>{
const data=docSnap.data();
const id=docSnap.id;

if(data.status==="pending"){
if(currentUser && currentUser.email===ADMIN_EMAIL){
pendingDiv.innerHTML+=`
<div class="app-card">
<h4>${data.name}</h4>
<p>${data.description}</p>
<p class="status">Status: Pending</p>
<button class="approve" onclick="approveApp('${id}')">Approve</button>
<button class="reject" onclick="rejectApp('${id}')">Reject</button>
</div>
`;
}
}

if(data.status==="approved"){
approvedDiv.innerHTML+=`
<div class="app-card">
<h4>${data.name}</h4>
<p>${data.description}</p>
<p class="status">Approved</p>
<a class="download" href="${data.link}" target="_blank">Download</a>
</div>
`;
}
});
}

window.approveApp=async(id)=>{
await updateDoc(doc(db,"apps",id),{
status:"approved"
});
loadApps();
};

window.rejectApp=async(id)=>{
await updateDoc(doc(db,"apps",id),{
status:"rejected"
});
loadApps();
};

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🇮🇳 Bharat AI App Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to right,#ff9933,#ffffff,#138808);
text-align:center;
}
.container{
max-width:1200px;
margin:20px auto;
background:white;
padding:20px;
border-radius:15px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-bottom:20px;
}
.card{
background:#f2f2f2;
padding:15px;
border-radius:10px;
cursor:pointer;
position:relative;
transition:0.3s;
}
.card:hover{
transform:scale(1.03);
}
.boost-badge{
position:absolute;
top:10px;
right:10px;
background:orange;
color:white;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}
button{
padding:6px 12px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
}
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}
.modal-content{
background:white;
padding:20px;
border-radius:12px;
width:300px;
}
</style>
</head>
<body>

<div class="container">

<h1>🇮🇳 Bharat AI App Store</h1>

<button id="loginBtn">Login</button>
<button id="logoutBtn" style="display:none;">Logout</button>
<h3 id="welcome"></h3>

<h3>Upload App</h3>
<input id="appName" placeholder="App Name"><br>
<textarea id="appDesc" placeholder="Description"></textarea><br>
<select id="appCategory">
<option value="">Select Category</option>
<option>AI</option>
<option>Education</option>
<option>Finance</option>
<option>Tools</option>
<option>Entertainment</option>
</select><br>
<input type="file" id="appFile"><br>
<button id="uploadBtn">Submit</button>

<hr>

<h2>🔥 Trending - AI</h2>
<div class="grid" id="aiApps"></div>

<h2>🔥 Trending - Education</h2>
<div class="grid" id="educationApps"></div>

<h2>🔥 Trending - Finance</h2>
<div class="grid" id="financeApps"></div>

<h2>🔥 Trending - Tools</h2>
<div class="grid" id="toolsApps"></div>

<h2>🔥 Trending - Entertainment</h2>
<div class="grid" id="entertainmentApps"></div>

<hr>

<h2>📂 All Apps</h2>
<div class="grid" id="approvedApps"></div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalTitle"></h3>
<p id="modalDesc"></p>
<a id="modalDownload" target="_blank">Download</a>

<h4>Rate this App</h4>
<button onclick="rateApp(1)">⭐1</button>
<button onclick="rateApp(2)">⭐2</button>
<button onclick="rateApp(3)">⭐3</button>
<button onclick="rateApp(4)">⭐4</button>
<button onclick="rateApp(5)">⭐5</button>

<br><br>
<button onclick="boostApp()">🚀 Boost (Free 30 Days)</button>

<br><br>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);
const provider=new GoogleAuthProvider();

let currentUser=null;
let currentAppId=null;

loginBtn.onclick=()=>signInWithPopup(auth,provider);
logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,(user)=>{
currentUser=user;
if(user){
welcome.innerHTML="Welcome "+user.displayName;
logoutBtn.style.display="inline";
loginBtn.style.display="none";
loadApps();
}else{
logoutBtn.style.display="none";
loginBtn.style.display="inline";
}
});

uploadBtn.onclick=async()=>{
if(!currentUser) return alert("Login first");
const file=appFile.files[0];
if(!file) return alert("Select file");

const storageRef=ref(storage,"apps/"+file.name);
await uploadBytes(storageRef,file);
const url=await getDownloadURL(storageRef);

await addDoc(collection(db,"apps"),{
name:appName.value,
description:appDesc.value,
category:appCategory.value,
fileURL:url,
developerEmail:currentUser.email,
rating:0,
totalRatings:0,
downloads:0,
boosted:false,
boostExpiry:null,
createdAt:serverTimestamp()
});

alert("Uploaded Successfully");
loadApps();
};

async function loadApps(){

aiApps.innerHTML="";
educationApps.innerHTML="";
financeApps.innerHTML="";
toolsApps.innerHTML="";
entertainmentApps.innerHTML="";
approvedApps.innerHTML="";

const snapshot = await getDocs(collection(db,"apps"));
let apps=[];

for(const docSnap of snapshot.docs){

let data = docSnap.data();
data.id = docSnap.id;

if(data.boostExpiry && data.boostExpiry.toDate() < new Date()){
await updateDoc(doc(db,"apps",data.id),{
boosted:false,
boostExpiry:null
});
data.boosted=false;
}

let score =
(data.rating*3) +
(data.totalRatings*2) +
(data.downloads*1) +
(data.boosted ? 500 : 0);

data.score = score;
apps.push(data);
}

apps.sort((a,b)=>b.score-a.score);

["AI","Education","Finance","Tools","Entertainment"].forEach(category=>{

let filtered = apps.filter(a=>a.category===category).slice(0,5);

filtered.forEach(app=>{
if(category==="AI") aiApps.innerHTML+=cardHTML(app);
if(category==="Education") educationApps.innerHTML+=cardHTML(app);
if(category==="Finance") financeApps.innerHTML+=cardHTML(app);
if(category==="Tools") toolsApps.innerHTML+=cardHTML(app);
if(category==="Entertainment") entertainmentApps.innerHTML+=cardHTML(app);
});

});

apps.forEach(app=>{
approvedApps.innerHTML+=cardHTML(app);
});

}

function cardHTML(app){
return `
<div class="card" onclick="openModal('${app.id}','${app.name}','${app.description}','${app.fileURL}')">
${app.boosted?'<div class="boost-badge">🔥 BOOSTED</div>':''}
<h4>${app.name}</h4>
<p>${app.category}</p>
<p>⭐ ${app.rating.toFixed(1)} (${app.totalRatings})</p>
<p>📥 ${app.downloads}</p>
</div>
`;
}

window.openModal=(id,name,desc,url)=>{
currentAppId=id;
modal.style.display="flex";
modalTitle.innerText=name;
modalDesc.innerText=desc;
modalDownload.href=url;
modalDownload.onclick=()=>increaseDownload(id);
};

window.closeModal=()=>modal.style.display="none";

async function increaseDownload(id){
const refDoc=doc(db,"apps",id);
const snap=await getDoc(refDoc);
await updateDoc(refDoc,{
downloads:(snap.data().downloads||0)+1
});
}

window.rateApp=async(star)=>{
if(!currentUser) return alert("Login first");
const refDoc=doc(db,"apps",currentAppId);
const snap=await getDoc(refDoc);
let d=snap.data();

let newAvg=((d.rating*d.totalRatings)+star)/(d.totalRatings+1);

await updateDoc(refDoc,{
rating:newAvg,
totalRatings:d.totalRatings+1
});

alert("Thanks for rating");
loadApps();
closeModal();
};

window.boostApp=async()=>{
if(!currentUser) return alert("Login first");

const refDoc=doc(db,"apps",currentAppId);
const snap=await getDoc(refDoc);
let d=snap.data();

const now=new Date();

if(d.boostExpiry && d.boostExpiry.toDate()>now){
alert("Already boosted for 30 days");
return;
}

let expiry=new Date();
expiry.setDate(expiry.getDate()+30);

await updateDoc(refDoc,{
boosted:true,
boostExpiry:expiry
});

alert("🔥 Boost Activated (Free 30 Days)");
loadApps();
closeModal();
};

</script>
</body>
</html>

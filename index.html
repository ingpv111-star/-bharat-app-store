<!DOCTYPE html>
<html>
<head>
  <title>🇮🇳 Bharat AI App Store</title>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ff9933, #ffffff, #138808);
      text-align: center;
    }

    .container {
      margin-top: 100px;
      background: white;
      width: 400px;
      margin-left: auto;
      margin-right: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #loginBtn {
      background: #4285F4;
      color: white;
    }

    #logoutBtn {
      background: #d9534f;
      color: white;
    }

    h1 {
      margin-bottom: 20px;
    }
  </style>

</head>
<body>

  <div class="container">

    <h1>🇮🇳 Bharat AI App Store</h1>

    <button id="loginBtn">Login with Google</button>
    <button id="logoutBtn" style="display:none;">Logout</button>

    <h2 id="welcome"></h2>

    <h3>Available Apps</h3>
    <div id="apps"></div>

  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyChGwSmE4D-ZmvoaBfAQJVzye4WBdbg4bc",
      authDomain: "bharat-app-store-8a633.firebaseapp.com",
      projectId: "bharat-app-store-8a633",
      storageBucket: "bharat-app-store-8a633.firebasestorage.app",
      messagingSenderId: "884921246902",
      appId: "1:884921246902:web:4dcd9e8f1413be24bd7217",
      measurementId: "G-PNK79SQ903"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const welcome = document.getElementById("welcome");

    loginBtn.onclick = () => {
      signInWithPopup(auth, provider)
        .catch((error) => {
          alert("Login Error: " + error.message);
        });
    };

    logoutBtn.onclick = () => {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        welcome.innerHTML = "Welcome " + user.displayName + " 🎉";
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline";
      } else {
        welcome.innerHTML = "";
        loginBtn.style.display = "inline";
        logoutBtn.style.display = "none";
      }
    });

  </script>

</body>
</html>

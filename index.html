<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } 
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyChGwSmE4D-ZmvoaBfAQJVzye4WBdbg4bc",
    authDomain: "bharat-app-store-8a633.firebaseapp.com",
    projectId: "bharat-app-store-8a633",
    storageBucket: "bharat-app-store-8a633.firebasestorage.app",
    messagingSenderId: "884921246902",
    appId: "1:884921246902:web:df39e5c157c123bebd7217",
    measurementId: "G-K2BCG57D54"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.login = function() {
    signInWithPopup(auth, provider)
      .then((result) => {
        const user = result.user;
        alert("Welcome " + user.displayName + " 🎉");
      })
      .catch((error) => {
        alert("Login Error: " + error.message);
      });
  }
</script>

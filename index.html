<!DOCTYPE html>
<html>
<head>
<title>🇮🇳 Bharat AI App Store</title>
<meta charset="UTF-8" />
<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to right,#ff9933,#ffffff,#138808);
text-align:center;
}
.container{
max-width:1200px;
margin:20px auto;
background:white;
padding:20px;
border-radius:15px;
}
button{
padding:6px 12px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}
.card{
background:#f2f2f2;
padding:15px;
border-radius:10px;
cursor:pointer;
}
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}
.modal-content{
background:white;
padding:20px;
border-radius:12px;
width:300px;
}
.star-btn{
background:#ff9933;
color:white;
}
</style>
</head>
<body>

<div class="container">

<h1>🇮🇳 Bharat AI App Store</h1>

<button id="loginBtn">Login</button>
<button id="logoutBtn" style="display:none;">Logout</button>

<h3 id="welcome"></h3>

<h3>Upload App</h3>
<input id="appName" placeholder="App Name"><br>
<textarea id="appDesc" placeholder="Description"></textarea><br>
<select id="appCategory">
<option value="">Select Category</option>
<option>AI</option>
<option>Education</option>
<option>Finance</option>
<option>Tools</option>
<option>Entertainment</option>
</select><br>
<input type="file" id="appFile"><br>
<button id="uploadBtn">Submit</button>

<h2>Approved Apps</h2>
<div class="grid" id="approvedApps"></div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalTitle"></h3>
<p id="modalDesc"></p>
<a id="modalDownload" target="_blank">Download</a>

<h4>Rate this App</h4>
<button class="star-btn" onclick="rateApp(1)">⭐1</button>
<button class="star-btn" onclick="rateApp(2)">⭐2</button>
<button class="star-btn" onclick="rateApp(3)">⭐3</button>
<button class="star-btn" onclick="rateApp(4)">⭐4</button>
<button class="star-btn" onclick="rateApp(5)">⭐5</button>

<br><br>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSy...",
authDomain:"bharat-app-store-8a633.firebaseapp.com",
projectId:"bharat-app-store-8a633",
storageBucket:"bharat-app-store-8a633.appspot.com",
appId:"1:..."
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);
const provider=new GoogleAuthProvider();

let currentUser=null;
let currentAppId=null;

loginBtn.onclick=()=>signInWithPopup(auth,provider);
logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,(user)=>{
currentUser=user;
if(user){
welcome.innerHTML="Welcome "+user.displayName;
logoutBtn.style.display="inline";
loginBtn.style.display="none";
loadApps();
}else{
logoutBtn.style.display="none";
loginBtn.style.display="inline";
}
});

uploadBtn.onclick=async()=>{
const file=document.getElementById("appFile").files[0];
if(!file) return alert("Select file");

const storageRef=ref(storage,"apps/"+file.name);
await uploadBytes(storageRef,file);
const url=await getDownloadURL(storageRef);

await addDoc(collection(db,"apps"),{
name:appName.value,
description:appDesc.value,
category:appCategory.value,
fileURL:url,
status:"approved",
developerEmail:currentUser.email,
rating:0,
totalRatings:0
});

alert("Uploaded Successfully");
loadApps();
};

async function loadApps(){
approvedApps.innerHTML="";

const snapshot=await getDocs(collection(db,"apps"));

snapshot.forEach(docSnap=>{
const data=docSnap.data();
const id=docSnap.id;

if(data.status==="approved"){
approvedApps.innerHTML+=`
<div class="card" onclick="openModal('${id}','${data.name}','${data.description}','${data.fileURL}')">
<h4>${data.name}</h4>
<p>${data.category}</p>
<p>⭐ ${data.rating?.toFixed(1) || 0} (${data.totalRatings || 0})</p>
</div>
`;
}
});
}

window.openModal=(id,name,desc,url)=>{
currentAppId=id;
modal.style.display="flex";
modalTitle.innerText=name;
modalDesc.innerText=desc;
modalDownload.href=url;
};

window.closeModal=()=>{
modal.style.display="none";
};

window.rateApp=async(star)=>{
if(!currentUser){
alert("Login first");
return;
}

const appRef=doc(db,"apps",currentAppId);
const snap=await getDoc(appRef);
const data=snap.data();

const oldRating=data.rating || 0;
const total=data.totalRatings || 0;

const newAverage=((oldRating * total) + star) / (total + 1);

await updateDoc(appRef,{
rating:newAverage,
totalRatings:total+1
});

alert("Thanks for rating ⭐");
loadApps();
closeModal();
};

</script>
</body>
</html>
